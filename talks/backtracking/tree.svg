    <text x="717.0" y="195" font-size="14" fill="#888" text-anchor="start">12</text>
    <rect x="639.0" y="253.0" width="72" height="34" rx="8" fill="#e3f1e8" stroke="#2e8b57" stroke-width="2"/><text x="675" y="276">cab</text>
    <text x="717.0" y="275" font-size="14" fill="#888" text-anchor="start">13</text>
    <rect x="789.0" y="173.0" width="72" height="34" rx="8" fill="#fff" stroke="#888" stroke-width="2"/><text x="825" y="196">cb</text>
    <text x="867.0" y="195" font-size="14" fill="#888" text-anchor="start">14</text>
    <rect x="789.0" y="253.0" width="72" height="34" rx="8" fill="#e3f1e8" stroke="#2e8b57" stroke-width="2"/><text x="825" y="276">cba</text>
