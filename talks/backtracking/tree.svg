    <text x="417.0" y="275" font-size="14" fill="#888" text-anchor="start">8</text>
    <rect x="489.0" y="173.0" width="72" height="34" rx="8" fill="#fff" stroke="#888" stroke-width="2"/><text x="525" y="196">bc</text>
    <text x="567.0" y="195" font-size="14" fill="#888" text-anchor="start">9</text>
    <rect x="489.0" y="253.0" width="72" height="34" rx="8" fill="#e3f1e8" stroke="#2e8b57" stroke-width="2"/><text x="525" y="276">bca</text>
