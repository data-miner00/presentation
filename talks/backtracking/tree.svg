    <line x1="450" y1="47.0" x2="150.0" y2="93.0"/>
    <line x1="150.0" y1="127.0" x2="75" y2="173.0"/>
    <line x1="75" y1="207.0" x2="75" y2="253.0"/>
    <line x1="150.0" y1="127.0" x2="225" y2="173.0"/>
    <line x1="225" y1="207.0" x2="225" y2="253.0"/>
    <line x1="450" y1="47.0" x2="450.0" y2="93.0"/>
    <line x1="450.0" y1="127.0" x2="375" y2="173.0"/>
    <line x1="375" y1="207.0" x2="375" y2="253.0"/>
    <line x1="450.0" y1="127.0" x2="525" y2="173.0"/>
    <line x1="525" y1="207.0" x2="525" y2="253.0"/>
    <line x1="450" y1="47.0" x2="750.0" y2="93.0"/>
    <line x1="750.0" y1="127.0" x2="675" y2="173.0"/>
    <line x1="675" y1="207.0" x2="675" y2="253.0"/>
