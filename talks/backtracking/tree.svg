    <rect x="114.0" y="93.0" width="72" height="34" rx="8" fill="#fff" stroke="#888" stroke-width="2"/><text x="150.0" y="116">a</text>
    <text x="192.0" y="115" font-size="14" fill="#888" text-anchor="start">1</text>
    <rect x="39.0" y="173.0" width="72" height="34" rx="8" fill="#fff" stroke="#888" stroke-width="2"/><text x="75" y="196">ab</text>
    <text x="117.0" y="195" font-size="14" fill="#888" text-anchor="start">2</text>
    <rect x="39.0" y="253.0" width="72" height="34" rx="8" fill="#e3f1e8" stroke="#2e8b57" stroke-width="2"/><text x="75" y="276">abc</text>
    <text x="117.0" y="275" font-size="14" fill="#888" text-anchor="start">3</text>
    <rect x="189.0" y="173.0" width="72" height="34" rx="8" fill="#fff" stroke="#888" stroke-width="2"/><text x="225" y="196">ac</text>
    <text x="267.0" y="195" font-size="14" fill="#888" text-anchor="start">4</text>
    <rect x="189.0" y="253.0" width="72" height="34" rx="8" fill="#e3f1e8" stroke="#2e8b57" stroke-width="2"/><text x="225" y="276">acb</text>
    <text x="267.0" y="275" font-size="14" fill="#888" text-anchor="start">5</text>
    <rect x="414.0" y="93.0" width="72" height="34" rx="8" fill="#fff" stroke="#888" stroke-width="2"/><text x="450.0" y="116">b</text>
    <text x="492.0" y="115" font-size="14" fill="#888" text-anchor="start">6</text>
    <rect x="339.0" y="173.0" width="72" height="34" rx="8" fill="#fff" stroke="#888" stroke-width="2"/><text x="375" y="196">ba</text>
