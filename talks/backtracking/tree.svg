<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"
     font-family="'Open Sans', sans-serif">
  <title>Search tree for the permutations of abc. Start branches to a, b and c, each of those to two-letter prefixes, and each prefix to one full permutation. Numbers give the depth-first visiting order.</title>
